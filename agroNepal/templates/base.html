{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AgroNepal{% endblock title %}</title>
    
    <link rel="icon" type="image/png" href="{% static 'assets/image/Logo.png' %}">
    <!-- Font Awesome CDN for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
      ::selection {
      background-color: green;
      color: white;
      }
    </style>

    <link rel="stylesheet" href="{% static 'assets/css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/header.css' %}" />
    
    
    <!--All Index files Css-->
    <link rel="stylesheet" href="{% static 'assets/css/indexCss/hero.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/indexCss/whoWeAre.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/indexCss/services.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/indexCss/beginnersGuide.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/indexCss/userFeedback.css' %}" />

    <!--All About Us files Css-->
    <link rel="stylesheet" href="{% static 'assets/css/aboutUsCss/aboutUs.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/aboutUsCss/whyChooseUs.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/aboutUsCss/provider.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/aboutUsCss/teamMember.css' %}" />

    <!--Blog page css-->
    <link rel="stylesheet" href="{% static 'assets/css/blog/blog.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/blog/readmoreBlog.css' %}" />

    <!----Event page---->
      <link rel="stylesheet" href="{% static 'assets/css/event/event.css' %}" />
      <link rel="stylesheet" href="{% static 'assets/css/event/ticket_buy.css' %}" />
    <!--Other pages Css-->
    <link rel="stylesheet" href="{% static 'assets/css/contact.css' %}" />
  

  </head>
  <body>
    {% block header %} 

    {% include "includes/header.html" %} 

    {% endblock header %}

    <main>
      {% block content %}
      {% endblock content %}
    </main>
  </body>
  {% block footer %} 

    {% include "includes/footer.html" %} 

    {% endblock footer %}
  
  <!---All Pages Js--->
  <script src="{% static 'assets/js/pages/contact.js' %}"></script>
  <script src="{% static 'assets/js/pages/readMoreBlog.js' %}"></script>
</html>

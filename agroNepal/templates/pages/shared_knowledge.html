{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="search-container">
  <div class="search-box">
    <form method="GET">
      <input type="text" name="search" placeholder="Search community stories..." value="{{ search_data }}">
      <button type="submit" style="background: none; border: none; cursor: pointer;">
        <i class="fas fa-search search-icon"></i>
      </button>
    </form>
  </div>
</div>
{% endblock content %}

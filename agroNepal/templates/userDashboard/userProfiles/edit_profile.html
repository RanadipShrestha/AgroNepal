{% extends "userDashboard.html" %} {% load static %} {% block content %} 
<div class="profile-container">
    <div class="profile-card">
        <div class="profile-header">
            <h1>Edit Profile</h1>
        </div>

        <form method="POST" action="{% url 'userUpdatedProfile' %}" id="profileForm">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" required>
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ user.username }}" required>
                </div>

                <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    <input type="tel" id="phone_number" name="phone_number" value="{{ user.phone_number }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" value="{{ user.address }}" required>
                </div>

                <div class="form-group">
                    <label for="land_address">Land Location</label>
                    <input type="text" id="land_address" name="land_address" value="{{ user.land_address }}" required>
                </div>
            </div>

            <div class="form-buttons">
                <button type="button" class="btn-save" onclick="showConfirmation()">Save Changes</button>
                <a href="{% url 'profile' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>

        <!-- Confirmation Modal -->
        <div class="confirmation-overlay" id="confirmationOverlay">
            <div class="confirmation-modal">
                <h3>Confirm Changes</h3>
                <p>Are you sure you want to update your profile?</p>
                <div class="confirmation-buttons">
                    <button class="btn-confirm-yes" onclick="submitForm()">Yes, Update</button>
                    <button class="btn-confirm-no" onclick="closeConfirmation()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
{%endblock content %}
